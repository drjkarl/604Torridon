name: Sync gallery photos

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current album photos
        run: python3 scripts/sync_photos.py

      - name: Commit changes if the album changed
        run: |
          git config user.name "torridon-photo-sync"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- data/photos.json; then
            git add data/photos.json
            git commit -m "Sync gallery with Google Photos album"
            git push
          else
            echo "No changes to the album."
          fi
